scenarios:
  - name: "Recruitment Applicant - Full Workflow: draft to open"
    steps:
      - step: "Setup - create job position"
        action: "create"
        model: "hr.job"
        save_as: "job"
        values:
          name: "Test Job Applicant"

      - step: "Setup - create vacancy in open state"
        action: "create"
        model: "recruitment_vacancy"
        save_as: "vacancy"
        as_user: "base.user_admin"
        values:
          job_id: "EVAL: registry['job'].id"
          applicant_number: 2
          date_start: 2025-01-01
          date_end: 2025-12-31

      - step: "Confirm vacancy"
        action: "call"
        target: "vacancy"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate vacancy cache after confirm"
        action: "call"
        target: "vacancy"
        method: "invalidate_cache"

      - step: "Approve vacancy to open"
        action: "call"
        target: "vacancy"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate vacancy cache after open"
        action: "call"
        target: "vacancy"
        method: "invalidate_cache"

      - step: "Create applicant in draft"
        action: "create"
        model: "recruitment_applicant"
        save_as: "applicant"
        as_user: "base.user_admin"
        values:
          applicant_name: "Test Applicant One"
          job_id: "EVAL: registry['job'].id"
          vacancy_id: "EVAL: registry['vacancy'].id"
          date: 2025-01-15

      - step: "Assert applicant created in draft"
        action: "assert"
        target: "applicant"
        asserts:
          state:
            type: "value"
            expected: "draft"
          applicant_name:
            type: "value"
            expected: "Test Applicant One"
          is_employee_created:
            type: "value"
            expected: false

      - step: "Confirm applicant"
        action: "call"
        target: "applicant"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate applicant cache after confirm"
        action: "call"
        target: "applicant"
        method: "invalidate_cache"

      - step: "Approve applicant to open"
        action: "call"
        target: "applicant"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

